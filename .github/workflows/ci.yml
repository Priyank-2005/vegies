# Runs the same checks as local development: typecheck, lint, tests against a real Postgres, and a production build.
name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: harihaat_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HH_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5433/harihaat_test
      HH_DATABASE_URL: postgres://postgres@127.0.0.1:5433/harihaat_test
      APP_ENCRYPTION_KEY: ZGVhZGJlZWZkZWFkYmVlZmRlYWRiZWVmZGVhZGJlZWY= # CI-only throw-away key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          OTP_PROVIDER: disabled
          NOTIFY_CHANNEL: disabled
